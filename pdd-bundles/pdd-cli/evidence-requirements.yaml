evidence_requirements:
  required:
    - protocol_version
    - implementation_artifact_hash
    - validator_versions
    - validation_results
    - dependency_manifest
    - discovery_log
  attestations:
    signed: true
    signer: PDD_EVIDENCE_KEY (HMAC-SHA256, same key as pdd-registry evidence)
  replay:
    deterministic_replay_required: true
    required_environment_metadata:
      - runtime
      - operating_system
      - dependency_lockfile
