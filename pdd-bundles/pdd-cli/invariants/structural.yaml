structural_invariants:
  - id: S-001
    statement: >
      Registry client requests and responses must conform to their referenced
      JSON Schemas (schemas/request.schema.json, schemas/response.schema.json),
      including additionalProperties:false strictness for the publish handshake.
    severity: must
    validation:
      - json_schema_validation
      - contract_tests

  - id: S-002
    statement: >
      All CLI failures must use the stable error envelope: an exit code from
      the enumerated set {0, 1, 2} and a human-readable message on stderr;
      usage errors exit 2, operational/validation/evidence failures exit 1.
    severity: must
    validation:
      - contract_tests

  - id: S-003
    statement: >
      Handshake versioning: minor versions may add optional fields only; no
      field may be removed, renamed, or made required within the same major
      version.
    severity: must
    validation:
      - schema_diff_check
