name: pdd-cli-commit-gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with: { python-version: "3.12" }
      - run: pip install -e . pytest==9.0.3 hypothesis==6.165.0
      - name: Bundle lint
        run: pdd workflow lint
      # make test runs the candidate suite under env -i (the signing key is
      # stripped there), then the loop needs the key for evidence steps.
      - name: Candidate suite (scrubbed)
        run: env -i PATH="$PATH" HOME="$(mktemp -d)" LANG="C.UTF-8" PBT_RUNS=200 \
            pytest implementations/pdd-cli/python-stdlib/tests -q
      - name: Three-layer Validator Loop (sandbox)
        run: pdd workflow validate pdd-bundles/pdd-cli --impl implementations/pdd-cli/python-stdlib --sandbox --pbt-runs 200
        env:
          VALIDATION_RESOURCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The signing key is scoped to the evidence steps only.
      - name: Evidence chain build + verify + staleness
        run: |
          pdd workflow evidence build pdd-bundles/pdd-cli --impl implementations/pdd-cli/python-stdlib \
            --validation-resource "$VALIDATION_RESOURCE"
          pdd workflow evidence verify pdd-bundles/pdd-cli
          pdd workflow staleness pdd-bundles/pdd-cli
        env:
          PDD_EVIDENCE_KEY: ${{ secrets.PDD_EVIDENCE_KEY }}
          VALIDATION_RESOURCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
